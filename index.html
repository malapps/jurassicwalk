<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1B5E20">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Dino Walk - Walk, discover amber, and hatch dinosaurs in the real world!">
  <title>Dino Walk</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Map container -->
  <div id="map"></div>

  <!-- Distance panel (bottom left) -->
  <div id="distance-panel">
    <span id="distance-value">0</span>
    <span id="distance-unit">m</span>
    <span id="distance-label">today</span>
  </div>

  <!-- Wake Lock indicator (top right, subtle) -->
  <div id="wakelock-indicator" title="Screen will stay awake while walking">
    🔆
  </div>

  <!-- Status bar for messages -->
  <div id="status-bar">
    <span id="status-text">Ready to walk!</span>
  </div>

  <!-- Load scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/state.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/map.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
