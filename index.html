<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1B5E20">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Jurassic Walk - Walk, discover amber, and hatch dinosaurs in the real world!">
  <title>Jurassic Walk</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Map container -->
  <div id="map"></div>

  <!-- Bottom bar: amber | distance | pause -->
  <div id="bottom-bar">
    <div class="bb-item" id="bb-amber">
      <span class="bb-icon">🟠</span>
      <span class="bb-value" id="amber-count">0</span>
      <span class="bb-label">amber</span>
    </div>
    <button class="bb-item bb-tappable" id="bb-distance" data-action="stats" disabled>
      <span class="bb-value" id="distance-value">0</span>
      <span class="bb-label">m today</span>
    </button>
    <button class="bb-item" id="bb-pause">
      <span class="bb-icon">▶</span>
    </button>
  </div>

  <!-- Start walk overlay (full screen) -->
  <div id="start-overlay">
    <div id="start-card">
      <div id="start-icon">🦕</div>
      <h1>Jurassic Walk</h1>
      <p>Walk to discover amber and hatch dinosaurs!</p>
      <button id="start-btn">START WALK</button>
    </div>
  </div>

  <!-- Load scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/state.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/map.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
