<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1B5E20">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Jurassic Walk – Walk, discover amber, and hatch dinosaurs in the real world!">
  <title>Jurassic Walk</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Map container -->
  <div id="map"></div>

  <!-- Floating bottom controls -->
  <div id="bottom-controls">
    <!-- Amber panel (opens incubator menu) -->
    <button id="amber-panel" class="bottom-panel">
      <span class="bb-icon">🟠</span>
      <span class="bb-value" id="amber-count">0</span>
      <span class="bb-label">amber</span>
    </button>

    <!-- Combined distance + pause panel -->
    <div id="distance-pause-panel" class="bottom-panel">
      <button id="distance-part" class="distance-button">
        <span class="bb-value" id="distance-value">0 m</span>
        <span class="bb-label">TODAY</span>
      </button>
      <div class="split-line"></div>
      <button id="pause-part" class="pause-button">
        <span class="pause-icon" id="pause-icon">▶</span>
      </button>
    </div>
  </div>

  <!-- Lab results modal -->
  <div id="lab-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <h2>🔬 Lab Results</h2>
      <div id="lab-content"></div>
      <button id="lab-close-btn">CONTINUE</button>
    </div>
  </div>

  <!-- Hatch modal -->
  <div id="hatch-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <h2>🦕 Hatched!</h2>
      <div id="hatch-content"></div>
      <button id="hatch-close-btn">AMAZING!</button>
    </div>
  </div>

  <!-- Incubator menu (slides up from bottom) -->
  <div id="incubator-menu" class="slide-up-menu hidden">
    <div class="menu-header">
      <h2>Incubator</h2>
      <button id="incubator-close-btn">✕</button>
    </div>
    <div id="incubator-content"></div>
  </div>

  <!-- Stats page (slides up from bottom) -->
  <div id="stats-page" class="slide-up-menu hidden">
    <div class="menu-header">
      <h2>📊 Stats</h2>
      <button id="stats-close-btn">✕</button>
    </div>
    <div id="stats-content"></div>
  </div>

  <!-- Start walk overlay -->
  <div id="start-overlay">
    <div id="start-card">
      <div id="start-icon">🦕</div>
      <h1>Jurassic Walk</h1>
      <p>Walk to discover amber and hatch dinosaurs!</p>
      <button id="start-btn">START WALK</button>
    </div>
  </div>

  <!-- Load scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/state.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/map.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/incubator.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
